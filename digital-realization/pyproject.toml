[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "information-field"
version = "0.1.0"
description = "Digital realizations of finite information-field response laws"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Cina Aghamohammadi"}]
dependencies = ["torch>=2.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
corpus = ["numpy", "pyarrow"]
native = ["ninja"]
test = ["build>=1.2", "pytest>=8", "numpy", "pyarrow"]

[project.urls]
Archive = "https://doi.org/10.5281/zenodo.21986663"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
information_field = ["py.typed", "native/*.cpp", "native/*.cu", "native/*.metal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
